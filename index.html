<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Afghan Emigration to Australia – Interactive Atlas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ---------------------------------------------------------
       APPLE + GOVERNMENT BLUE THEME (SOLID, CLEAN, MODERN)
       --------------------------------------------------------- */

    :root {
      --bg: #f5f5f7;              /* Apple light grey */
      --bg-alt: #ffffff;          /* White surfaces */
      --sidebar: #f2f2f4;         /* Soft grey sidebar */
      --accent: #0a84ff;          /* Apple blue */
      --accent-soft: rgba(10,132,255,0.12);
      --accent-strong: #0060df;   /* Darker blue */
      --text: #1d1d1f;            /* Apple black */
      --muted: #6e6e73;           /* Apple muted grey */
      --border: #d2d2d7;          /* Apple border grey */
      --card-radius: 14px;
      --shadow-soft: 0 4px 12px rgba(0,0,0,0.08);
      --transition-fast: 0.18s ease-out;
      --transition-med: 0.28s ease-out;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ---------------------------------------------------------
       LAYOUT
       --------------------------------------------------------- */

    .app-shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      width: 100%;
      max-width: 1400px;
      margin: 20px auto;
      border-radius: 18px;
      background: var(--bg-alt);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* ---------------------------------------------------------
       SIDEBAR
       --------------------------------------------------------- */

    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      max-width: 180px;
      line-height: 1.4;
    }

    .nav-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-fast);
      color: var(--text);
    }

    .nav-item:hover {
      background: #e9e9eb;
    }

    .nav-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #e5e5ea;
      color: var(--muted);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ---------------------------------------------------------
       MAIN AREA
       --------------------------------------------------------- */

    .main {
      background: var(--bg-alt);
      display: flex;
      flex-direction: column;
    }

    .main-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .main-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .main-subtitle {
      font-size: 13px;
      color: var(--muted);
      max-width: 500px;
      line-height: 1.4;
    }

    .main-body {
      padding: 20px 24px;
      overflow-y: auto;
    }

    /* ---------------------------------------------------------
       CARDS
       --------------------------------------------------------- */

    .card {
      background: #ffffff;
      border-radius: var(--card-radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 16px;
    }

    .card-header {
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      border: 1px solid var(--accent);
    }

    .text-block {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 10px;
    }

    .text-muted {
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    /* ---------------------------------------------------------
       GRID LAYOUTS
       --------------------------------------------------------- */

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 20px;
    }

    /* ---------------------------------------------------------
       FACTOR ITEMS (Push/Pull)
       --------------------------------------------------------- */

    .factor-item {
      background: #f9f9fb;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .factor-item:hover {
      background: #eef6ff;
      border-color: var(--accent);
    }

    .factor-item-title {
      font-weight: 600;
      font-size: 13px;
    }

    .factor-item-body {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .factor-detail {
      background: #f9f9fb;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: var(--text);
    }

    /* ---------------------------------------------------------
       QUALITY OF LIFE BARS
       --------------------------------------------------------- */

    .qol-bar-track {
      background: #e5e5ea;
      border-radius: 999px;
      height: 8px;
      position: relative;
      overflow: hidden;
    }

    .qol-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 0.3s ease;
    }

    /* ---------------------------------------------------------
       STORY CHOICES
       --------------------------------------------------------- */

    .story-choice {
      background: #f9f9fb;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .story-choice:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .story-log {
      background: #f9f9fb;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
      max-height: 140px;
      overflow-y: auto;
    }

    /* ---------------------------------------------------------
       SECTIONS
       --------------------------------------------------------- */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }
  </style>
</head>
<body>
